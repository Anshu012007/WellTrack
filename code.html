<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WellTrack</title>

<style>
:root{
 --primary:#36454F;
 --secondary:#EDC9AF;
 --accent:#FFAD60; 
 --bg:#FDF6EC;
 --text:#2E2E2E;
}
body.dark{
 --bg:#1E1E1E;
 --secondary:#2E2E2E;
 --text:#F5F5F5;
}
body{
 margin:0;
 font-family:Segoe UI, sans-serif;
 background:var(--bg);
 color:var(--text);
}
header{
 background:var(--primary);
 color:var(--secondary);
 padding:15px;
 text-align:center;
 position:relative;
}
section{
 background:var(--secondary);
 margin:15px;
 padding:15px;
 border-radius:12px;
}
button,input{
 padding:8px;
 margin:4px;
 border-radius:6px;
 border:1px solid var(--primary);
}
button{
 background:var(--primary);
 color:white;
 cursor:pointer;
}
ul{list-style:none;padding:0}
li{
 background:#F7E7D0;
 margin:6px 0;
 padding:10px;
 border-radius:6px;
 display:flex;
 justify-content:space-between;
}
body.dark li{background:#3A3A3A;color:#F5F5F5}

/* Dashboard */
.dashboard{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:10px;
}
.card{
 background:#F7E7D0;
 padding:12px;
 border-radius:10px;
 text-align:center;
}
body.dark .card{background:#3A3A3A}

/* Header buttons */
#notifBtn{
 position:absolute;
 right:90px;
 top:15px;
 background:none;
 border:none;
 font-size:22px;
 cursor:pointer;
}
#notifCount{
 position:absolute;
 right:85px;
 top:10px;
 background:red;
 color:white;
 border-radius:50%;
 padding:4px 8px;
 font-size:12px;
 display:none;
}
#logoutBtn{
 position:absolute;
 right:15px;
 top:15px;
}
#notifBox{
 display:none;
 position:absolute;
 right:15px;
 top:55px;
 width:280px;
 background:white;
 padding:10px;
 border-radius:8px;
 box-shadow:0 0 8px rgba(0,0,0,0.3);
 z-index:100;
}
body.dark #notifBox{background:#2E2E2E;color:#F5F5F5}

/* Calendar */
.calendar-container{max-width:350px;margin:auto}
.weekdays,.calendar{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:3px;
 text-align:center;
}
.day{
 background:#F7E7D0;
 padding:5px;
 min-height:60px;
 border-radius:6px;
 font-size:12px;
}
body.dark .day{background:#3A3A3A}
.day.today{border:2px solid var(--accent)}
.taskDot{
 width:6px;height:6px;
 background:var(--primary);
 border-radius:50%;
 display:inline-block;
 margin:2px;
}

/* Weekly wellbeing (ORIGINAL) */
.week-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:10px;
}
.week-card{
 background:#F7E7D0;
 padding:10px;
 border-radius:10px;
 text-align:center;
 font-size:13px;
}
body.dark .week-card{background:#3A3A3A}
.week-card h4{margin:5px 0}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" style="max-width:350px;margin:50px auto;text-align:center">
 <h2>👤 Login</h2>
 <input id="username" placeholder="Enter your name">
 <button onclick="login()">Login</button>
</div>

<div id="app" style="display:none">

<header>
 <h2>WellTrack</h2>
 <p id="welcome"></p>
 <button onclick="toggleTheme()">🌙</button>
 <button id="notifBtn" onclick="toggleNotifications()">🔔</button>
 <span id="notifCount">0</span>
 <button id="logoutBtn" onclick="logout()">Logout</button>
 <div id="notifBox"></div>
</header>

<section>
<h3>📊 Dashboard</h3>
<div class="dashboard">
 <div class="card">Total <p id="total">0</p></div>
 <div class="card">Completed <p id="completed">0</p></div>
 <div class="card">Pending <p id="pending">0</p></div>
 <div class="card">Time-Bound <p id="timebound">0</p></div>
</div>
</section>

<section>
<h3>📝 Tasks</h3>
<input id="taskText" placeholder="Task">
<input type="date" id="taskDate">
<button onclick="addTask()">Add</button>
<ul id="list"></ul>
</section>

<section>
<h3>📅 Calendar</h3>
<div class="calendar-container">
 <div class="weekdays">
  <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
  <div>Thu</div><div>Fri</div><div>Sat</div>
 </div>
 <div class="calendar" id="calendar"></div>
</div>
</section>

<section>
<h3>💪 Health Tracker (Today)</h3>
<input type="number" id="water" placeholder="Water (glasses)">
<input type="number" id="steps" placeholder="Steps">
<input type="number" id="sleep" placeholder="Sleep (hrs)">
<button onclick="saveHealth()">Save</button>
</section>

<section>
<h3>📊 Weekly Digital Wellbeing</h3>
<div class="week-grid" id="weekGrid"></div>
</section>

<section>
<h3>🧠 Mood Tracker</h3>
<button onclick="setMood('😊')">😊</button>
<button onclick="setMood('😐')">😐</button>
<button onclick="setMood('😔')">😔</button>
<button onclick="setMood('😠')">😠</button>
<button onclick="setMood('😴')">😴</button>
<ul id="moodList"></ul>
</section>

</div>

<script>
let user=localStorage.getItem("user");
let tasks=JSON.parse(localStorage.getItem("tasks"))||[];
let moods=JSON.parse(localStorage.getItem("moods"))||[];
let health=JSON.parse(localStorage.getItem("health"))||{};
let theme=localStorage.getItem("theme")||"light";

if(theme==="dark") document.body.classList.add("dark");

function login(){
 if(!username.value.trim())return;
 localStorage.setItem("user",username.value);
 init();
}
function logout(){
 localStorage.removeItem("user");
 location.reload();
}
function init(){
 loginBox.style.display="none";
 app.style.display="block";
 welcome.textContent="Welcome, "+localStorage.getItem("user");
 prefillHealth();
 render();renderMoods();renderWeek();
}
if(user) init();

function toggleTheme(){
 document.body.classList.toggle("dark");
 localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
}

/* Tasks */
function saveTasks(){localStorage.setItem("tasks",JSON.stringify(tasks));}
function addTask(){
 if(!taskText.value.trim())return;
 tasks.push({text:taskText.value,date:taskDate.value,done:false});
 taskText.value="";taskDate.value="";
 saveTasks();render();
}
function toggleTask(i){tasks[i].done=!tasks[i].done;saveTasks();render();}
function deleteTask(i){tasks.splice(i,1);saveTasks();render();}

function render(){
 list.innerHTML="";
 tasks.forEach((t,i)=>{
  const li=document.createElement("li");
  if(t.done) li.style.textDecoration="line-through";
  li.innerHTML=`${t.text} ${t.date||""}
  <div>
   <button onclick="toggleTask(${i})">✔</button>
   <button onclick="deleteTask(${i})">❌</button>
  </div>`;
  list.appendChild(li);
 });
 updateDashboard();updateNotifications();renderCalendar();
}

function updateDashboard(){
 total.textContent=tasks.length;
 completed.textContent=tasks.filter(t=>t.done).length;
 pending.textContent=tasks.filter(t=>!t.done).length;
 timebound.textContent=tasks.filter(t=>t.date).length;
}

/* Notifications */
function toggleNotifications(){
 notifBox.style.display=notifBox.style.display==="block"?"none":"block";
}
function updateNotifications(){
 const today=new Date().toISOString().split("T")[0];
 let alerts=[];
 tasks.forEach(t=>{
  if(!t.done&&t.date){
   if(t.date===today) alerts.push("⏰ Due Today: "+t.text);
   if(t.date<today) alerts.push("⚠ Overdue: "+t.text);
  }
 });
 notifBox.innerHTML=alerts.length?alerts.map(a=>`<p>${a}</p>`).join(""):"No alerts 🎉";
 notifCount.style.display=alerts.length?"inline":"none";
 notifCount.textContent=alerts.length;
}

/* Calendar */
function renderCalendar(){
 calendar.innerHTML="";
 const now=new Date(),y=now.getFullYear(),m=now.getMonth();
 const first=new Date(y,m,1).getDay();
 const days=new Date(y,m+1,0).getDate();
 const today=now.toISOString().split("T")[0];

 for(let i=0;i<first;i++) calendar.appendChild(document.createElement("div"));

 for(let d=1;d<=days;d++){
  const date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const div=document.createElement("div");
  div.className="day";
  if(date===today) div.classList.add("today");
  div.innerHTML=`<strong>${d}</strong>`;
  tasks.filter(t=>t.date===date).forEach(()=>div.innerHTML+=`<span class="taskDot"></span>`);
  calendar.appendChild(div);
 }
}

/* Mood */
function setMood(m){
 const d=new Date().toISOString().split("T")[0];
 moods=moods.filter(x=>x.date!==d);
 moods.push({date:d,mood:m});
 localStorage.setItem("moods",JSON.stringify(moods));
 renderMoods();
}
function renderMoods(){
 moodList.innerHTML="";
 moods.slice().reverse().forEach(m=>moodList.innerHTML+=`<li>${m.date} → ${m.mood}</li>`);
}

/* Health + Weekly (ORIGINAL LOGIC) */
function saveHealth(){
 const d=new Date().toISOString().split("T")[0];
 health[d]={water:+water.value||0,steps:+steps.value||0,sleep:+sleep.value||0};
 localStorage.setItem("health",JSON.stringify(health));
 renderWeek();
}
function prefillHealth(){
 const d=new Date().toISOString().split("T")[0];
 if(health[d]){
  water.value=health[d].water;
  steps.value=health[d].steps;
  sleep.value=health[d].sleep;
 }
}
function renderWeek(){
 weekGrid.innerHTML="";
 let totalWater=0,totalSteps=0,totalSleep=0,count=0;

 for(let i=6;i>=0;i--){
  const dt=new Date();dt.setDate(dt.getDate()-i);
  const d=dt.toISOString().split("T")[0];
  const h=health[d]||{water:0,steps:0,sleep:0};
  if(health[d]){totalWater+=h.water;totalSteps+=h.steps;totalSleep+=h.sleep;count++;}
  weekGrid.innerHTML+=`
   <div class="week-card">
    <h4>${dt.toLocaleDateString(undefined,{weekday:'short'})}</h4>
    <small>${d}</small>
    <p>💧 ${h.water}</p>
    <p>🚶 ${h.steps}</p>
    <p>💤 ${h.sleep}</p>
   </div>`;
 }

 if(count){
  weekGrid.innerHTML+=`
   <div class="week-card" style="background:#FFD580">
    <h4>Average</h4>
    <p>💧 ${(totalWater/count).toFixed(1)}</p>
    <p>🚶 ${(totalSteps/count).toFixed(1)}</p>
    <p>💤 ${(totalSleep/count).toFixed(1)}</p>
   </div>`;
 }
}
</script>

</body>
</html>
